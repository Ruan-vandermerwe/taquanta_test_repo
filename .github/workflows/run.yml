name: Run Python Pipeline

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to run"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]
      script:
        description: "Module to run (default: src.main)"
        required: false
        default: "src.main"
        type: string
  schedule:
    - cron: "0 1 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.env || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Select env & module
        id: envsel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env=${{ inputs.env }}" >> $GITHUB_OUTPUT
            echo "module=${{ inputs.script }}" >> $GITHUB_OUTPUT
          else
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "env=prod" >> $GITHUB_OUTPUT
            else
              echo "env=dev" >> $GITHUB_OUTPUT
            fi
            echo "module=src.main" >> $GITHUB_OUTPUT
          fi

      - name: Export environment
        run: |
          echo "APP_ENV=${{ steps.envsel.outputs.env }}" >> $GITHUB_ENV
          echo "RUN_ID=${{ github.run_id }}" >> $GITHUB_ENV

      - name: Run Python module
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: |
          set -e
          python -m ${{ steps.envsel.outputs.module }} --env "$APP_ENV" --run-id "$RUN_ID" | tee run.log

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ steps.envsel.outputs.env }}-${{ github.run_number }}
          path: run.log
          retention-days: 7
